<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasanca — Türkçe Pop & Duygusal Şarkılar</title>
  <meta name="description" content="Hasanca — Türkçe pop ve duygusal şarkılarıyla dinleyicilerle buluşan müzik sanatçısı. Spotify, YouTube Music ve TikTok'ta dinleyebilirsiniz.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 50%, #1a0f2e 100%);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #ffd89b, #19547b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      font-size: 1.1rem;
      color: #c9b9d9;
      margin-bottom: 3rem;
      font-style: italic;
    }
    .bio {
      font-size: 1rem;
      color: #d8d0e5;
      margin-bottom: 2.5rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-width: 320px;
      margin: 0 auto;
    }
    .link {
      display: block;
      padding: 0.9rem 1.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #f5f5f5;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }
    .link:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      border-color: rgba(255, 216, 155, 0.4);
    }
    .footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #8a7ba5;
    }
    .footer a {
      color: #c9b9d9;
      text-decoration: none;
      margin: 0 0.5rem;
    }
    .footer a:hover { color: #ffd89b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>HASANCA</h1>
    <p class="tagline">söylenemeyenlere ses olan şarkılar</p>

    <p class="bio">
      Türkçe pop ve duygusal şarkılar. Hikaye ve melodinin buluştuğu yerde,
      söyleyemediklerimizi söyleyen sesler.
    </p>

    <div class="links">
      <a href="https://hyperfollow.com/hasanca" class="link" target="_blank" rel="noopener">
        🎵 Spotify & YouTube Music
      </a>
      <a href="https://www.tiktok.com/@xhasanca" class="link" target="_blank" rel="noopener">
        📱 TikTok — @xhasanca
      </a>
    </div>

    <div class="footer">
      <p>&copy; 2026 Hasanca. Tüm hakları saklıdır.</p>
      <p style="margin-top: 0.5rem;">
        <a href="privacy-policy.html">Gizlilik Politikası</a> ·
        <a href="terms.html">Hizmet Şartları</a>
      </p>
    </div>
  </div>
</body>
</html>
