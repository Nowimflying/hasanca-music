name: Buffer Slot Doldurucu

on:
  schedule:
    # Her 3 saatte bir (UTC). TR=UTC+3 so this hits TR 02:00, 05:00, 08:00, ...
    - cron: '17 */3 * * *'
  workflow_dispatch: {}  # Manuel tetikleme icin de

permissions:
  contents: write  # state.json commit/push icin

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fill-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fill script
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: python scripts/buffer_fill.py

      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet scripts/state.json; then
            git add scripts/state.json
            git commit -m "chore: update buffer state [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi
